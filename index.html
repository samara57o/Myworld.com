
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My world</title>

    <style>

       
/* 1. CONFIGURAÇÕES GERAIS */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background-color: #101810;
    background-image: url("images/background.jpg");
    background-size: cover;
    background-attachment: fixed;
    font-family: monospace;
    color: #c8dea1;
}


/* 2. JANELA PRINCIPAL */

.browser {
    max-width: 650px;
    margin: 0 auto;
    padding: 8px;
    background-color: #304333;
    border-radius: 9px;
}


/* 3. SEPARADORES */

.tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: #91ae94;
    padding: 8px;
    border-radius: 8px 8px 0 0;
}

.tab {
    background-color: #304333;
    padding: 10px 25px;
    border-radius: 7px 7px 0 0;
    font-weight: bold;
}

.active {
    color: #c8dea1;
}

.lights {
    margin-left: auto;
    display: flex;
    gap: 12px;
}

.lights span {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background-color: #c4db10;

    lights span 
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background-color: #c4db10;
}


/* 4. BARRA DO NAVEGADOR */

.toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    color: #c8dea1;
    font-size: 22px;
}

.address {
    flex: 1;
    background-color: black;
    color: #91ae94;
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
}

.window-button {
    background-color: black;
    padding: 5px 12px;
    border-radius: 5px;
}


/* 5. BANNER */

.banner {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
}


/* 6. APRESENTAÇÃO */

.intro {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
    padding: 8px;
}

.intro h1 {
    font-size: 38px;
    font-style: italic;
    margin: 0 0 10px;
    color: #c8dea1;
}

.intro p,
.about p {
    line-height: 1.6;
    font-size: 14px;
}

.intro img {
    width: 100%;
    height: 215px;
    object-fit: cover;
}


/* 7. BOTÕES */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.buttons a {
    background-color: #91ae94;
    color: #304333;
    padding: 9px;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
}

.buttons a:hover {
    background-color: #c8dea1;
}


/* 8. ABOUT ME */

.about {
    display: grid;
    grid-template-columns: 2fr 3fr;
    gap: 10px;
    padding: 8px;
}

.about > img {
    width: 100%;
    height: 240px;
    object-fit: cover;
}

.about h2 {
    background-color: #91ae94;
    color: #304333;
    padding: 9px;
    border-radius: 6px;
    margin: 0;
}

.about h2 span {
    float: right;
}

.about-buttons {
    display: flex;
    gap: 10px;
}

.about-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background-color: #91ae94;
    font-size: 16px;
    font-weight: bold;
}


/* 9. RODAPÉ */

footer {
    background-color: #91ae94;
    color: #304333;
    text-align: center;
    padding: 7px;
    border-radius: 6px;
    font-weight: bold;
}


/* 10. ADAPTAÇÃO AO TELEMÓVEL */

@media (max-width: 480px) {

    body {
        padding: 5px;
    }

    .intro {
        grid-template-columns: 1fr;
    }

    .about {
        grid-template-columns: 1fr;
    }

    .intro img {
        height: 200px;
    }

    .about > img {
        height: 200px;
    }

    .intro h1 {
        font-size: 30px;
    }

    .tab {
        padding: 8px 12px;
    }
}


    </style>
</head>

<body>

    <!-- JANELA PRINCIPAL -->

    <main class="browser">

        <!-- SEPARADORES -->

        <header class="tabs">
            <div class="tab active">Casa</div>
            <div class="tab">Diário</div>
            <div class="tab">Rotinas</div>

            <div class="lights">
                <div class="lights 1"><span></span></div>
                <div class="lights 2"><span></span></div>
                <div class="lights"><span></span></div>
            </div>
        </header>


        <!-- BARRA DO NAVEGADOR -->

        <div class="toolbar">
            <span>❮</span>
            <span>❯</span>
            <span>⟳</span>

            <div class="address">
                type an url here...
            </div>

            <span class="window-button">−</span>
            <span class="window-button">×</span>
        </div>


        <!-- BANNER -->

        <img class="banner" src="images/banner.jpg" alt="Banner verde">


        <!-- APRESENTAÇÃO -->

        <section class="intro">

            <div class="intro-text">

                <h1>My world</h1>

                <p>
                    Mini information about you.
                    Welcome to my little digital world.
                </p>

                <div class="buttons">
                    <a href="#">Instagram</a>
                    <a href="#">Pinterest</a>
                    <a href="#">Music</a>
                    <a href="#">Contact</a>
                </div>

            </div>

            <img src="images/computer.jpg" alt="Computadores retro">

        </section>


        <!-- ABOUT ME -->

        <section class="about">

            <img src="images/eye.jpg" alt="Arte digital verde">

            <div class="about-content">

                <h2>About [Name] <span>⌄</span></h2>

                <p>
                    Lorem ipsum dolor sit amet,
                    consectetur adipiscing elit.
                    Welcome to my world!
                </p>

                <div class="about-buttons">
                    <button>♟ Block</button>
                    <button>＋ Add</button>
                </div>

            </div>

        </section>


        <!-- RODAPÉ -->

        <footer>
            by My world · 2026
        </footer>

    </main>

</body>
</html>
